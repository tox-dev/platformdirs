name: check
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags-ignore: ["**"]
  pull_request:
    types: [opened, reopened, synchronize]
  schedule:
    - cron: "0 8 * * *"
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    name: test ${{ matrix.py }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        py:
          - "pypy3.11"
          - "3.15"
          - "3.15t"
          - "3.14"
          - "3.13"
          - "3.12"
          - "3.11"
        os:
          - ubuntu-24.04
          - windows-2025-vs2026
          - macos-26
        exclude:
          - {os: windows-2025-vs2026, py: pypy3.11}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install tox
        run: uv tool install --python-preference only-managed --python 3.15 tox --with tox-uv
      - name: Install Python
        run: uv python install --python-preference only-managed ${{ matrix.py }}
      - name: Setup test suite
        run: tox run -vv --notest --skip-missing-interpreters false -e ${{ matrix.py }}
        env:
          UV_PYTHON_PREFERENCE: only-managed
      - name: Run test suite
        run: |
          if [[ "$MATRIX_PY" == pypy* ]]; then
            tox run --skip-pkg-install -e "$MATRIX_PY" --
          else
            tox run --skip-pkg-install -e "$MATRIX_PY"
          fi
        shell: bash
        env:
          MATRIX_PY: ${{ matrix.py }}
          PYTEST_ADDOPTS: "-vv --durations=20"
          UV_PYTHON_PREFERENCE: only-managed
          DIFF_AGAINST: HEAD
      - name: Rename coverage report file
        if: ${{ !startsWith(matrix.py, 'pypy')}}
        run: |
          import os; import sys
          os.rename(f".tox/.coverage.${{ matrix.py }}", f".tox/.coverage.${{ matrix.py }}-{sys.platform}")
        shell: python
      - name: Upload coverage data
        if: ${{ !startsWith(matrix.py, 'pypy')}}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          include-hidden-files: true
          name: .coverage.${{ matrix.os }}.${{ matrix.py }}
          path: ".tox/.coverage.*"
          retention-days: 3
  coverage:
    name: Combine coverage
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Download coverage data
        id: coverage-data
        background: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: .tox
          pattern: .coverage.*
          merge-multiple: true
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install tox
        run: uv tool install --python-preference only-managed --python 3.15 tox --with tox-uv
      - name: Build package to generate version
        run: uv build --python 3.15 --python-preference only-managed --wheel . --out-dir dist
      - name: Setup coverage tool
        run: tox -e coverage --notest
        env:
          UV_PYTHON_PREFERENCE: only-managed
      - wait: coverage-data
      - name: Combine and report coverage
        run: tox -e coverage --skip-pkg-install
        env:
          UV_PYTHON_PREFERENCE: only-managed
      - name: Upload HTML report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: html-report
          path: .tox/htmlcov
  check:
    name: ${{ matrix.tox_env }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025-vs2026
        tox_env:
          - dev
          - type
          - docs
          - pkg_meta
        exclude:
          - {os: windows-2025-vs2026, tox_env: pkg_meta}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: Install tox
        run: uv tool install --python-preference only-managed --python 3.15 tox --with tox-uv
      - name: Setup test suite
        run: tox run -vv --notest --skip-missing-interpreters false -e ${{ matrix.tox_env }}
        env:
          UV_PYTHON_PREFERENCE: only-managed
      - name: Run test suite
        run: tox run --skip-pkg-install -e ${{ matrix.tox_env }}
        env:
          UV_PYTHON_PREFERENCE: only-managed
  hook-update-cooldown:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - uses: tox-dev/github-workflows/check-hook-update-cooldown@cadf58a0dcc5d0c7853b248ab7c2b19bb93675d1
  gate:
    name: Required checks pass
    if: ${{ !cancelled() }} # codespell:ignore cancelled
    needs: [test, coverage, check, hook-update-cooldown]
    runs-on: ubuntu-24.04
    steps:
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          jq -e --arg event "$EVENT_NAME" '
            all(
              to_entries[];
              .value.result == "success" or
              ((.key == "hook-update-cooldown") and
               .value.result == "skipped" and $event != "pull_request")
            )
          ' <<<"$NEEDS_JSON"
