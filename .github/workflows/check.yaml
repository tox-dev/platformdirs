name: 🧪 check
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags-ignore: ["**"]
  pull_request:
    types: [opened, reopened, synchronize]
  schedule:
    - cron: "19 7 * * 1"
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    name: 🧪 test ${{ matrix.py }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        py:
          - "pypy3.11"
          - "3.15"
          - "3.15t"
          - "3.14"
          - "3.13"
          - "3.12"
          - "3.11"
        os:
          - ubuntu-24.04
          - windows-2025-vs2026
          - macos-26
        # macOS keeps 3.15 and 3.11 on every event; the full macOS matrix runs on the weekly cron only.
        exclude: ${{ fromJSON(github.event.schedule == '19 7 * * 1' && '[{"os":"windows-2025-vs2026","py":"pypy3.11"}]' || '[{"os":"windows-2025-vs2026","py":"pypy3.11"},{"os":"macos-26","py":"pypy3.11"},{"os":"macos-26","py":"3.15t"},{"os":"macos-26","py":"3.14"},{"os":"macos-26","py":"3.13"},{"os":"macos-26","py":"3.12"}]') }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 📦 Install tox
        run: uv tool install --python-preference only-managed --python 3.15 tox --with tox-uv
      - name: 🐍 Install Python ${{ matrix.py }}
        run: uv python install --python-preference only-managed ${{ matrix.py }}
      - name: 📦 Set up test suite
        run: tox run -vv --notest --skip-missing-interpreters false -e ${{ matrix.py }}
        env:
          UV_PYTHON_PREFERENCE: only-managed
      - name: 🧪 Run test suite
        run: |
          if [[ "$MATRIX_PY" == pypy* ]]; then
            tox run --skip-pkg-install -e "$MATRIX_PY" --
          else
            tox run --skip-pkg-install -e "$MATRIX_PY"
          fi
        shell: bash
        env:
          MATRIX_PY: ${{ matrix.py }}
          PYTEST_ADDOPTS: "-vv --durations=20"
          UV_PYTHON_PREFERENCE: only-managed
          DIFF_AGAINST: HEAD
      - name: 📊 Rename coverage report file
        if: ${{ !startsWith(matrix.py, 'pypy')}}
        run: |
          import os; import sys
          os.rename(f".tox/.coverage.${{ matrix.py }}", f".tox/.coverage.${{ matrix.py }}-{sys.platform}")
        shell: python
      - name: 📤 Upload coverage data
        if: ${{ !startsWith(matrix.py, 'pypy')}}
        uses: actions/upload-artifact@v7.0.2
        with:
          include-hidden-files: true
          name: .coverage.${{ matrix.os }}.${{ matrix.py }}
          path: ".tox/.coverage.*"
          retention-days: 3
  coverage:
    name: 📊 Combine coverage
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 📩 Download coverage data
        id: coverage-data
        background: true
        uses: actions/download-artifact@v8.0.2
        with:
          path: .tox
          pattern: .coverage.*
          merge-multiple: true
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 📦 Install tox
        run: uv tool install --python-preference only-managed --python 3.15 tox --with tox-uv
      - name: 🏗️ Build package to generate version
        run: uv build --python 3.15 --python-preference only-managed --wheel . --out-dir dist
      - name: 📦 Set up coverage tool
        run: tox -e coverage --notest
        env:
          UV_PYTHON_PREFERENCE: only-managed
      - name: ⏳ Wait for coverage data
        wait: coverage-data
      - name: 📊 Combine and report coverage
        run: tox -e coverage --skip-pkg-install
        env:
          UV_PYTHON_PREFERENCE: only-managed
      - name: 📤 Upload HTML report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: html-report
          path: .tox/htmlcov
  check:
    name: 🔍 check
    uses: tox-dev/github-workflows/.github/workflows/check.yaml@bf1c3ab0aa137d307a07aad844d507af73039387 # 6.8.0
    permissions:
      contents: read
    with:
      os: ubuntu-24.04
      include: |
        [
          {"env": "dev"},
          {"env": "dev", "os": "windows-2025-vs2026"},
          {"env": "type"},
          {"env": "type", "os": "windows-2025-vs2026"},
          {"env": "docs"},
          {"env": "docs", "os": "windows-2025-vs2026"},
          {"env": "pkg_meta"}
        ]
  release:
    name: 🏷️ Release dry run
    uses: $/.github/workflows/prepare-release.yaml
    permissions:
      contents: read
      pull-requests: read
    with:
      dry-run: true
  hooks:
    name: 🧹 Hooks under the cooldown
    uses: tox-dev/github-workflows/.github/workflows/cooled-hooks.yaml@bf1c3ab0aa137d307a07aad844d507af73039387 # 6.8.0
    permissions:
      contents: read
  gate:
    name: 🚦 ${{ github.event_name == 'pull_request' && 'Required checks pass' || 'Non-PR checks pass' }}
    if: ${{ !cancelled() }} # codespell:ignore cancelled
    needs: [test, coverage, check, release, hooks]
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: 🚦 Require all needed jobs to pass
        uses: tox-dev/github-workflows/required-checks@6.8.0
        with:
          needs: ${{ toJSON(needs) }}
