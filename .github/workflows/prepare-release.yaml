name: 🛠️ Prepare release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: auto
        type: choice
        options: [auto, major, minor, patch]
permissions:
  contents: read
jobs:
  prepare-release:
    name: 📝 build changelog and tag
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: release-auth
    permissions:
      contents: read
    steps:
      - id: token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: 📥 Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history so the version calculation sees the latest tag
          token: ${{ steps.token.outputs.token }}
          persist-credentials: true # zizmor: ignore[artipacked] the release job pushes main and its tag
      - name: 📦 Setup uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.15"
          enable-cache: false
      - name: 🔢 Compute next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          current=$(git tag --list --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          current=${current:-0.0.0}
          IFS='.' read -r major minor patch <<< "$current"
          bump="$BUMP"
          if [ "$bump" = "auto" ]; then
            if ls docs/changelog/*.breaking.rst >/dev/null 2>&1; then
              bump=major
            elif ls docs/changelog/*.feature.rst >/dev/null 2>&1; then
              bump=minor
            else
              bump=patch
            fi
          fi
          case "$bump" in
            major) next="$((major + 1)).0.0" ;;
            minor) next="$major.$((minor + 1)).0" ;;
            patch) next="$major.$minor.$((patch + 1))" ;;
          esac
          echo "Bumping $current -> $next ($bump)"
          echo "version=$next" >> "$GITHUB_OUTPUT"
      - name: 📝 Build changelog, commit, and tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_SLUG: ${{ steps.token.outputs.app-slug }}
        run: |
          if git ls-remote --tags origin "refs/tags/$VERSION" | grep -q .; then
            echo "::error::Tag $VERSION already exists"
            exit 1
          fi
          if ! compgen -G 'docs/changelog/*.*.rst' > /dev/null; then
            echo "::error::no changelog fragments to release"
            exit 1
          fi
          app_user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${app_user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          uvx towncrier build --yes --version "$VERSION"
          # towncrier's headers and wrapping don't match docstrfmt, so the next PR pre-commit.ci touches would
          # otherwise carry an unrelated changelog reformat. Pre-commit exits non-zero when it rewrites a file.
          uvx --from pre-commit --with pre-commit-uv pre-commit run docstrfmt --files docs/changelog.rst || true
          git add docs/changelog docs/changelog.rst
          git commit -m "Release $VERSION"
          git tag "$VERSION"
          git push origin HEAD:main
          git push origin "$VERSION"
