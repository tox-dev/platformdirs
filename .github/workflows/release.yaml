name: 🚀 Release
on:
  push:
    branches: ["main"]
    tags: ["*"]
  pull_request:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: read
env:
  dists-artifact-name: python-package-distributions
jobs:
  build-pr:
    name: 🏗️ Build distributions
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 🏗️ Build distributions
        uses: tox-dev/github-workflows/build-python-distribution@259a3d3fb578d00517ffb73341fdd463259b0b2f # 6.0.1
      - name: 📤 Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.dists-artifact-name }}
          path: dist/*
          if-no-files-found: error
  build:
    name: 🏗️ Build
    if: startsWith(github.ref, 'refs/tags/')
    uses: tox-dev/github-workflows/.github/workflows/validate-python-release.yaml@259a3d3fb578d00517ffb73341fdd463259b0b2f # 6.0.1
    permissions:
      contents: read
  release:
    name: 🚀 Publish to PyPI
    needs: [build, notes]
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/project/platformdirs/${{ github.ref_name }}
    permissions:
      id-token: write
    steps:
      - name: 📩 Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.distributions-artifact-id }}
          path: dist/
      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
  pypi_verify:
    name: 🔍 Verify PyPI distributions
    needs: [build, release]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 📩 Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.distributions-artifact-id }}
          path: dist
      - name: 🔍 Verify PyPI artifacts
        uses: tox-dev/github-workflows/reconcile-pypi-artifacts@259a3d3fb578d00517ffb73341fdd463259b0b2f # 6.0.1
        with:
          project: platformdirs
          version: ${{ github.ref_name }}
          dist: dist
  notes:
    name: 📝 Render GitHub Release notes
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 📦 Install locked release tools
        uses: tox-dev/github-workflows/install-locked-tools@259a3d3fb578d00517ffb73341fdd463259b0b2f # 6.0.1
        with:
          groups: release-notes
          venv: ${{ runner.temp }}/release-tools
      - name: 🏷️ Select previous tag
        id: previous
        uses: tox-dev/github-workflows/select-previous-tag@259a3d3fb578d00517ffb73341fdd463259b0b2f # 6.0.1
        with:
          tag: ${{ github.ref_name }}
      - name: 📝 Render release notes
        uses: tox-dev/github-workflows/render-release-notes@259a3d3fb578d00517ffb73341fdd463259b0b2f # 6.0.1
        with:
          tag: ${{ github.ref_name }}
          previous: ${{ steps.previous.outputs.previous }}
          changelog: docs/changelog.rst
          artifact-url: https://pypi.org/project/platformdirs/${{ github.ref_name }}/
      - name: 📤 Upload release notes
        id: upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: github-release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error
  github-release:
    name: 🚀 Publish GitHub Release
    needs: [pypi_verify, notes]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - name: 📩 Download release notes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.notes.outputs.artifact-id }}
          path: ${{ runner.temp }}/release-notes
      - name: 🚀 Publish GitHub release
        uses: tox-dev/github-workflows/publish-github-release@259a3d3fb578d00517ffb73341fdd463259b0b2f # 6.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          title: ${{ github.ref_name }}
          notes-file: ${{ runner.temp }}/release-notes/release-notes.md
