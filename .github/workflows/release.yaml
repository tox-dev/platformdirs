name: 🚀 Release
on:
  push:
    branches: ["main"]
    tags: ["*"]
  pull_request:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: read
env:
  dists-artifact-name: python-package-distributions
jobs:
  build-pr:
    name: 🏗️ Build distributions
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: 📥 Check out code
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: 🐍 Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: latest-known
          python-version: "3.15"
          enable-cache: false
      - name: 🏗️ Build distributions
        uses: tox-dev/github-workflows/build-python-distribution@6.8.0
      - name: 📤 Upload distributions
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ${{ env.dists-artifact-name }}
          path: dist/*
          if-no-files-found: error
  build:
    name: 🏗️ Build
    if: startsWith(github.ref, 'refs/tags/')
    uses: tox-dev/github-workflows/.github/workflows/validate-python-release.yaml@bf1c3ab0aa137d307a07aad844d507af73039387 # 6.8.0
    permissions:
      contents: read
  release:
    name: 🚀 Publish to PyPI
    needs: [build, notes]
    runs-on: ubuntu-26.04
    environment:
      name: release
      url: https://pypi.org/project/platformdirs/${{ github.ref_name }}
    permissions:
      id-token: write
    steps:
      - name: 📩 Download distributions
        uses: actions/download-artifact@v8.0.2
        with:
          artifact-ids: ${{ needs.build.outputs.distributions-artifact-id }}
          path: dist/
      - name: 🚀 Publish to PyPI
        uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          packages-dir: dist
  notes:
    name: 📝 Render GitHub Release notes
    if: startsWith(github.ref, 'refs/tags/')
    uses: tox-dev/github-workflows/.github/workflows/release-notes.yaml@bf1c3ab0aa137d307a07aad844d507af73039387 # 6.8.0
    permissions:
      contents: read
    with:
      tag: ${{ github.ref_name }}
      changelog: docs/changelog.rst
      artifact-url: https://pypi.org/project/platformdirs/${{ github.ref_name }}/
  github-release:
    name: 🚀 Publish GitHub Release
    needs: [build, release, notes]
    uses: tox-dev/github-workflows/.github/workflows/github-release.yaml@bf1c3ab0aa137d307a07aad844d507af73039387 # 6.8.0
    permissions:
      contents: write
    with:
      project: platformdirs
      version: ${{ github.ref_name }}
      tag: ${{ github.ref_name }}
      artifact-pattern: python-package-distributions
      notes-artifact-id: ${{ needs.notes.outputs.artifact-id }}
