name: Label maintenance PRs
on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] This workflow reads PR metadata without checkout or PR code.
    types: [opened, reopened, synchronize]
permissions: {}
jobs:
  label:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - uses: tox-dev/github-workflows/label-bot-news@60edc05324abc8e592818262dc63b36fb7b70f8c
        with:
          fragments: docs/changelog
          extension: rst
