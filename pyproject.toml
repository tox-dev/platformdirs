[build-system]
build-backend = "hatchling.build"
requires = [
  "hatch-fancy-pypi-readme>=25.1",
  "hatch-vcs>=0.5",
  "hatchling>=1.29",
]

[project]
name = "platformdirs"
import-names = [ "platformdirs" ]
description = "A small Python package for determining appropriate platform-specific dirs, e.g. a `user data dir`."
keywords = [
  "appdirs",
  "application",
  "cache",
  "directory",
  "log",
  "user",
]
license = "MIT"
maintainers = [
  { name = "Bernát Gábor", email = "gaborjbernat@gmail.com" },
  { name = "Julian Berman", email = "Julian@GrayVines.com" },
  { name = "Ofek Lev", email = "oss@ofek.dev" },
  { name = "Ronny Pfannschmidt", email = "opensource@ronnypfannschmidt.de" },
]
requires-python = ">=3.11"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dynamic = [
  "readme",
  "version",
]
urls.Changelog = "https://platformdirs.readthedocs.io/en/latest/changelog.html"
urls.Documentation = "https://platformdirs.readthedocs.io"
urls.Homepage = "https://github.com/tox-dev/platformdirs"
urls.Source = "https://github.com/tox-dev/platformdirs"
urls.Tracker = "https://github.com/tox-dev/platformdirs/issues"
entry-points.pytest11.platformdirs = "platformdirs.pytest_plugin"

[dependency-groups]
dev = [
  { include-group = "coverage" },
  { include-group = "docs" },
  { include-group = "fix" },
  { include-group = "pkg-meta" },
  { include-group = "test" },
  { include-group = "type" },
]
test = [
  "appdirs==1.4.4",
  "covdefaults>=2.3",
  "diff-cover>=10.2",
  "pytest>=9.0.2",
  "pytest-cov>=7",
  "pytest-mock>=3.15.1",
]
type = [
  "ty>=0.0.19",
  { include-group = "docs-core" },
  { include-group = "release" },
  { include-group = "test" },
]
docs = [
  { include-group = "docs-core" },
  { include-group = "release" },
  "furo>=2025.12.19",
  "sphinx-autodoc-typehints>=3.9.2",
  "sphinx-copybutton>=0.5.2",
  "sphinx-design>=0.7",
  "sphinx-llm>=0.4.1,!=1.1",
  "sphinx-sitemap>=2.9",
  "sphinxcontrib-mermaid>=2",
  "sphinxcontrib-towncrier>=0.5.0a0",
  "sphinxext-opengraph>=0.13",
  "uv>=0.12.22",
]
coverage = [
  "covdefaults>=2.3",
  "coverage[toml]>=7.13.4",
  "diff-cover>=10.2",
]
docs-core = [ "sphinx>=9.1" ]
fix = [
  "pre-commit-uv>=4.2.1",
]
lock-tools = [ "nab==0.0.22" ]
pkg-meta = [
  "check-wheel-contents>=0.6.3",
  "twine>=6.2",
  "uv>=0.10.7",
]
release = [
  "mdformat-gfm>=1",
  "mdformat-ruff>=0.1.3",
  "prek>=0.5",
  "release-creator>=0.6.5",
  "towncrier>=26.9",
]
release-check = [
  "prek>=0.5",
]
release-news = [
  "release-creator>=0.6.5",
  "towncrier>=26.9",
]
release-notes = [
  "release-creator>=0.6.5",
]
release-prepare = [
  "prek>=0.5",
  "release-creator>=0.6.5",
  "towncrier>=26.9",
]
release-validate = [
  "prek>=0.5",
  "release-creator>=0.6.5",
]

[tool.hatch]
version.source = "vcs"
metadata.hooks.fancy-pypi-readme.content-type = "text/markdown"
metadata.hooks.fancy-pypi-readme.fragments = [ { path = "README.md" } ]
build.hooks.vcs.version-file = "src/platformdirs/version.py"
build.targets.sdist.include = [
  "/src",
  "/tests",
  "/tox.toml",
]

[tool.uv]
dependency-groups.dev = { requires-python = ">=3.15" }
dependency-groups.docs = { requires-python = ">=3.15" }
dependency-groups.docs-core = { requires-python = ">=3.12" }
dependency-groups.release = { requires-python = ">=3.15" }
dependency-groups.release-check = { requires-python = ">=3.15" }
dependency-groups.release-news = { requires-python = ">=3.15" }
dependency-groups.release-notes = { requires-python = ">=3.15" }
dependency-groups.release-prepare = { requires-python = ">=3.15" }
dependency-groups.release-validate = { requires-python = ">=3.15" }
dependency-groups.type = { requires-python = ">=3.15" }

[tool.ruff]
line-length = 120
format.preview = true
lint.select = [
  "ALL",
]
lint.ignore = [
  "CPY",                               # no copyright notices
  "DOC",                               # no support for restructuredtext
  "escape-sequence-in-docstring",      # Use `r"""` if any backslashes in a docstring
  "hardcoded-bind-all-interfaces",     # Possible binding to all interfaces
  "incorrect-blank-line-before-class", # `one-blank-line-before-class` (D203) and `no-blank-line-before-class` (D211) are incompatible
  "line-too-long",                     # line length handled by ruff format (code) and docstrfmt (docstrings)
  "missing-blank-line-after-summary",  # 1 blank line required between summary line and description
  "missing-trailing-comma",            # conflict
  "multi-line-summary-second-line",    # `multi-line-summary-second-line` (D213) conflicts with docstrfmt which uses D212 style
  "non-empty-init-module",             # `__init__` module should only contain docstrings and re-exports
  "non-imperative-mood",               # The first line of docstring should be in imperative mood
]
lint.per-file-ignores."tests/**/*.py" = [
  "assert",                               # asserts allowed in tests
  "D",                                    # don't care about documentation in tests
  "FBT",                                  # don't care about booleans as positional arguments in tests
  "implicit-namespace-package",           # no implicit namespace
  "import-private-name",                  # Private name import
  "magic-value-comparison",               # Magic value used in comparison, consider replacing with a constant variable
  "pytest-fixture-autouse",               # shared setup fixtures are meant to apply to every test
  "subprocess-without-shell-equals-true", # `subprocess` call: check for execution of untrusted input
  "too-many-positional-arguments",        # Too many positional arguments
]
lint.isort = { known-first-party = [
  "platformdirs",
  "tests",
], required-imports = [
  "from __future__ import annotations",
] }
lint.preview = true

[tool.codespell]
builtin = "clear,usage,en-GB_to_en-US"
count = true
quiet-level = 3

[tool.pyproject-fmt]
max_supported_python = "3.15"

[tool.ty]
environment.python-version = "3.15"

[tool.coverage]
run.parallel = true
run.plugins = [
  "covdefaults",
]
paths.other = [
  ".",
  "*/platformdirs",
  "*\\platformdirs",
]
paths.source = [
  "src",
  ".tox/*/lib/*/site-packages",
  ".tox\\*\\Lib\\site-packages",
  "**/src",
  "**\\src",
]
report.fail_under = 76
html.show_contexts = true
html.skip_covered = false

[tool.towncrier]
name = "platformdirs"
directory = "docs/changelog"
filename = "docs/changelog.rst"
template = "release_creator.fragments:template.rst.jinja2"
title_format = false
issue_format = ":pr:`{issue}`"
underlines = [ "*", "=", "-" ]
type = [
  { directory = "feature", name = "Added", showcontent = true },
  { directory = "change", name = "Changes", showcontent = true },
  { directory = "bugfix", name = "Fixed", showcontent = true },
  { directory = "doc", name = "Documentation", showcontent = true },
  { directory = "breaking", name = "Breaking changes", showcontent = true },
  { directory = "security", name = "Security", showcontent = true },
  { directory = "performance", name = "Performance", showcontent = true },
  { directory = "deprecation", name = "Deprecated", showcontent = true },
  { directory = "removal", name = "Removed", showcontent = true },
  { directory = "packaging", name = "Packaging", showcontent = true },
]

[tool.nab]
mode = "universal"
base-group = "project-runtime"
build-group = "build"
default-groups = []
uploaded-prior-to = "P7D"
decision-order = "stable"
matrix.python = ">=3.15,<3.16"
matrix.platforms = [ "linux_x86_64", "linux_aarch64", "macos_arm64", "windows_amd64" ]
packages.release-creator.uploaded-prior-to = "2026-10-23T19:54:50Z"

[[tool.nab.package-rules]]
match = [ "nab", "nab-index", "nab-markersets", "nab-project", "nab-provider", "nab-resolver" ]
uploaded-prior-to = "2026-10-18T05:45:09Z"
